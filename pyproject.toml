[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "journalprose"
version = "0.2.0"
description = "Advanced scholarly writing standards and local editorial review tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "FerdinandRies"}]
maintainers = [{name = "FerdinandRies"}]
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
keywords = ["academic-writing", "argumentation", "scholarly-writing", "editing", "grammar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = ["build>=1.2"]

[project.scripts]
journalprose = "journalprose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["journalprose*"]
namespaces = false

[tool.setuptools.package-data]
"journalprose.data" = ["*.json"]
