[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "well-argued-prose"
version = "0.1.1"
description = "Argument-first standards and review tools for advanced scholarly writing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
keywords = ["academic-writing", "argumentation", "philosophy", "scholarly-writing", "editorial-review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1"]

[project.scripts]
well-argued-prose = "well_argued_prose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"well_argued_prose.data" = ["*.json"]
